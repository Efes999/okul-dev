<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/2416501081.css">

    <script type="module" src="js/event-form.js"></script>

    <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
</head>

<body>

<header>
    <h1>Etkinlik Güncelle</h1>

    <nav aria-label="Ana menü">
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
</header>

<main>

    <form id="event-form" data-mode="guncelle" novalidate>

        <p>
            <label for="title">Etkinlik Adı</label>
            <input
                type="text"
                id="title"
                name="title"
            >
        </p>

        <p>
            <label for="category">Kategori</label>

            <select
                id="category"
                name="category"
            >
                <option value="">Kategori seçiniz</option>
                <option value="Seminer">Seminer</option>
                <option value="Atölye">Atölye</option>
                <option value="Konferans">Konferans</option>
                <option value="Spor">Spor</option>
            </select>
        </p>

        <p>
            <label for="date">Tarih</label>

            <input
                type="date"
                id="date"
                name="date"
            >
        </p>

        <p>
            <label for="time">Saat</label>

            <input
                type="time"
                id="time"
                name="time"
            >
        </p>

        <p>
            <label for="location">Yer</label>

            <input
                type="text"
                id="location"
                name="location"
            >
        </p>

        <p>
            <label for="capacity">Kontenjan</label>

            <input
                type="number"
                id="capacity"
                name="capacity"
                min="1"
                max="1000"
            >
        </p>

        <p>
            <label for="description">Açıklama</label>

            <textarea
                id="description"
                name="description"
                rows="6"
            ></textarea>
        </p>

        <button type="submit">
            Güncelle
        </button>

        <div id="form-mesaj"></div>

    </form>

</main>

<footer>
    <p>Efe SARIHAN 2416501081 2026</p>
</footer>

</body>
</html>
